name: Generate Bengali Definitions

# Manual only: the branch this used to watch (fix/bengali-localized-corpus) is
# gone. Run it from the Actions tab on a working branch, never on main.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-bengali-definitions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    # The job commits and pushes generated files; keep it off the default branch.
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out translation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            'torch==2.5.1' 'transformers==4.46.3' sentencepiece sacremoses

      - name: Generate all 791 Bengali definitions
        run: python scripts/generate-bengali-definitions.py

      - name: Validate generated corpus
        run: |
          test -s src/i18n/bengaliDefinitions.generated.ts
          grep -q 'export const bengaliDefinitions' src/i18n/bengaliDefinitions.generated.ts

      - name: Commit generated definitions
        run: |
          if [ -z "$(git status --porcelain -- src/i18n/bengaliDefinitions.generated.ts)" ]; then
            echo 'Bengali definitions are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/bengaliDefinitions.generated.ts
          git commit -m 'Generate Bengali definitions for all 791 terms'
          git push origin HEAD:${{ github.ref_name }}
