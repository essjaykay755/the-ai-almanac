name: Capture 60fps product intro

on:
  push:
    branches:
      - video-capture/real-ui-product-film
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout capture branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Chromium and headed-browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Ensure FFmpeg and Xvfb are available
        shell: bash
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg xvfb
          fi
          ffmpeg -version | head -n 1
          xvfb-run --help >/dev/null

      - name: Build the real application
        run: npm run build

      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/almanac-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Vite preview is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/almanac-preview.log
          exit 1

      - name: Record actual React UI at native 60fps
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension RANDR" \
            node scripts/capture-product-intro.mjs

      - name: Assemble 30-second launch-film master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p video-output-intro/final video-output-intro/qc

          RAW=video-output-intro/almanac-product-intro-60fps.mp4
          JSON=video-output-intro/capture-timeline.json
          OUT=video-output-intro/final/ai-almanac-product-intro-30s-60fps.mp4
          FLIP=public/sounds/page-flip.mp3
          TEAR=public/sounds/paper-tear.mp3
          test -f "$RAW"
          test -f "$FLIP"
          test -f "$TEAR"

          # Capture has a deliberate ~0.5s recorder pre-roll; retain 50ms of it for the opening settle.
          START=0.450
          DUR=30.000
          TERM_MS=$(node -e "const t=require('./$JSON'); process.stdout.write(String(Math.max(0,Math.round(t.markers.termTurn+50))))")
          RELATED_MS=$(node -e "const t=require('./$JSON'); process.stdout.write(String(Math.max(0,Math.round((t.markers.relatedTurn??t.markers.termTurn)+50))))")
          BOOKMARK_MS=$(node -e "const t=require('./$JSON'); process.stdout.write(String(Math.max(0,Math.round(t.markers.bookmark+50))))")
          ABOUT_MS=$(node -e "const t=require('./$JSON'); process.stdout.write(String(Math.max(0,Math.round(t.markers.aboutTurn+50))))")

          echo "page sound markers term=$TERM_MS related=$RELATED_MS bookmark=$BOOKMARK_MS about=$ABOUT_MS"

          ffmpeg -y \
            -ss "$START" -i "$RAW" \
            -i "$FLIP" \
            -i "$FLIP" \
            -i "$FLIP" \
            -i "$TEAR" \
            -f lavfi -t "$DUR" -i "sine=frequency=55:sample_rate=48000" \
            -f lavfi -t "$DUR" -i "sine=frequency=110:sample_rate=48000" \
            -f lavfi -t "$DUR" -i "anoisesrc=color=pink:amplitude=0.08:sample_rate=48000" \
            -filter_complex "\
              [0:v]fps=60,tpad=stop_mode=clone:stop_duration=6,trim=duration=${DUR},setpts=PTS-STARTPTS,format=yuv420p,fade=t=in:st=0:d=.24,fade=t=out:st=29.18:d=.82[vout];\
              [1:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=.60,adelay=${TERM_MS}|${TERM_MS}[flip1];\
              [2:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=.48,adelay=${RELATED_MS}|${RELATED_MS}[flip2];\
              [3:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=.52,adelay=${ABOUT_MS}|${ABOUT_MS}[flip3];\
              [4:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=.38,adelay=${BOOKMARK_MS}|${BOOKMARK_MS}[tear];\
              [5:a]volume=.055,lowpass=f=180,afade=t=in:st=0:d=1.4,afade=t=out:st=28.2:d=1.8[drone];\
              [6:a]volume=.016,lowpass=f=420,afade=t=in:st=2:d=2.2,afade=t=out:st=28:d=2[harmonic];\
              [7:a]highpass=f=120,lowpass=f=1100,volume=.028,afade=t=in:st=0:d=1.2,afade=t=out:st=28.4:d=1.6[air];\
              [drone][harmonic][air][flip1][flip2][flip3][tear]amix=inputs=7:normalize=0:duration=longest,alimiter=limit=.88,atrim=duration=${DUR},afade=t=out:st=29.25:d=.75[aout]" \
            -map "[vout]" -map "[aout]" \
            -c:v libx264 -preset slow -crf 16 -profile:v high -level 4.2 \
            -c:a aac -b:a 256k -ar 48000 \
            -movflags +faststart \
            -t "$DUR" \
            "$OUT"

      - name: Quality-control master
        shell: bash
        run: |
          set -euo pipefail
          OUT=video-output-intro/final/ai-almanac-product-intro-30s-60fps.mp4

          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json "$OUT" > video-output-intro/qc/ffprobe.json

          ffmpeg -y -i "$OUT" \
            -vf "fps=1/3,scale=480:-2,tile=5x2" \
            -frames:v 1 video-output-intro/qc/contact-sheet.jpg

          ffmpeg -i "$OUT" \
            -filter_complex ebur128=peak=true \
            -f null - 2> video-output-intro/qc/loudness.txt || true

          cat video-output-intro/qc/ffprobe.json

      - name: Upload 60fps launch-film artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-almanac-product-intro-30s-60fps
          if-no-files-found: error
          retention-days: 7
          path: |
            video-output-intro/final/ai-almanac-product-intro-30s-60fps.mp4
            video-output-intro/capture-timeline.json
            video-output-intro/qc/contact-sheet.jpg
            video-output-intro/qc/ffprobe.json
            video-output-intro/qc/loudness.txt
