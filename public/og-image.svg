  <text x="322" y="274" fill="#6b5e4b" font-family="Georgia, 'Times New Roman', serif" font-size="17">1.</text>
  <text x="351" y="274" fill="#282119" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="23"><tspan x="351" y="274">An evolving field guide to artificial intelligence</tspan><tspan x="351" y="305">concepts, architectures and practices.</tspan></text>
  <path d="M318 390H864" stroke="#4c3a23" stroke-opacity=".22" />
