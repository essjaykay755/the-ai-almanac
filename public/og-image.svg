  <path d="M904 340H908" stroke="#7f2c24" stroke-width="2" />
  <text x="908" y="350" fill="#5e5343" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic"><tspan x="908" y="350">Keep the useful distinction</tspan><tspan x="908" y="367">close at hand.</tspan></text>
